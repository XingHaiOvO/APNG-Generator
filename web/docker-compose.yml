version: "3.9"

services:
  apng-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: apng-web:latest
    container_name: apng-web
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 如服务器内存有限，可取消注释以下资源限制
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: "1.0"